version: "3.8"

services:

  # =========================
  # FRONTEND
  # =========================
  frontend:
    build:
      context: ./frontend
      target: ${MODE}
    container_name: frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

    environment:
      - NODE_ENV=${MODE}

    # Development only
    volumes:
      - ./frontend:/app
      - /app/node_modules

    restart: unless-stopped


  # =========================
  # BACKEND
  # =========================
  backend:
    build:
      context: ./backend
      target: ${MODE}

    container_name: backend

    ports:
      - "8000:8000"

    environment:
      - NODE_ENV=${MODE}
      - MONGO_URI=mongodb://db:27017/webRTC_video_app
      - REDIS_URL=redis://redis:6379

    depends_on:
      - db
      - redis

    # Development only
    volumes:
      - ./backend:/app
      - /app/node_modules

    restart: unless-stopped


  # =========================
  # MONGODB
  # =========================
  db:
    image: mongo:latest

    container_name: mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    restart: unless-stopped


  # =========================
  # REDIS
  # =========================
  redis:
    image: redis:7.2-alpine

    container_name: redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    restart: unless-stopped


volumes:
  mongodb_data:
  redis_data: